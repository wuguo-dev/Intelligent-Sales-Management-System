spring:
  datasource:
    url: ${HAOWUGOU_DB_URL:jdbc:mysql://127.0.0.1:3306/haowugou?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${HAOWUGOU_DB_USERNAME:root}
    password: ${HAOWUGOU_DB_PASSWORD}
